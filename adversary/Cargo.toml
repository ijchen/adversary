[package]
name = "adversary"
version = "0.1.0"
authors = ["Isaac Chen"]
description = "Adversarial property-based testing for Rust."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ijchen/adversary"
documentation = "https://docs.rs/adversary"
edition = "2024"
include = ["/src/", "/Cargo.toml", "/README.md", "/LICENSE-*"]
publish = false

[lints]
workspace = true

[dependencies]
# Not updating rand to 0.9 yet - Uniform isize sampling support was removed :(
rand = "0.8.5"
adversary-macros = { version = "0.1.0", path = "../adversary-macros", optional = true }
paste = "1.0.15"
pair = "0.2.0"
chillpill = "0.1.0"

[dev-dependencies]

[features]
default = ["macros"]
macros = ["dep:adversary-macros"]
