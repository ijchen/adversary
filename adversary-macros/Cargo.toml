[package]
name = "adversary-macros"
version = "0.1.0"
authors = ["Isaac Chen"]
description = "Procedural macros for the adversary crate."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ijchen/adversary"
documentation = "https://docs.rs/adversary-macros"
edition = "2021"
include = ["/src/", "/Cargo.toml", "/README.md", "/LICENSE-*"]
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.86"
quote = "1.0.37"
syn = "2.0.77"

[dev-dependencies]

[profile.release]
lto = "thin" # TODO: benchmark what setting is best here

[profile.test]
opt-level = 3           # Enable optimizations
debug-assertions = true # True is the default value, but make it clear we care
overflow-checks = true  # True is the default value, but make it clear we care
